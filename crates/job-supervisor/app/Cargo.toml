[package]
name = "dubflow-supervisor"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Durable Rust process supervisor for the DubFlow production worker"
license = "MIT"
publish = false

[[bin]]
name = "dubflow-supervisor"
path = "src/main.rs"

[dependencies]
dubflow-job-state = { path = "../state" }
dubflow-worker-protocol = { path = "../protocol" }
dubflow-source-queue = { path = "../source_queue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
