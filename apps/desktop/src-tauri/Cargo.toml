[package]
name = "dubflow-desktop-host"
version = "0.1.0"
description = "DubFlow Local desktop host"
authors = ["DubFlow contributors"]
license = "MIT"
repository = "https://github.com/thanhtuyen662002/DubFlow"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "DubFlow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.15.4"
tauri = { version = "=2.12.0", features = [] }

[target.'cfg(windows)'.dependencies]
# Already in the lockfile through Tauri; only the Credential Manager API is added.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
