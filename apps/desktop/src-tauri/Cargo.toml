[package]
name = "dubflow-desktop-host"
version = "0.1.0"
description = "DubFlow Local desktop host"
authors = ["DubFlow contributors"]
license = "MIT"
repository = "https://github.com/thanhtuyen662002/DubFlow"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "DubFlow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.8.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.8.4", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
