name: PR Documentary Windows

# Read-only Windows lane for the documentary host (#464): runs the desktop
# host's Rust tests, including the NTFS junction regression for the reserved
# source-media store. No secrets, signing, release, upload or publish step.
# The push trigger only bootstraps the lane on its own task branch before the
# file exists on Main.
on:
  push:
    branches: [agent/issue-464-docu-output-root-confinement]
    paths:
      - .github/workflows/pr-documentary-windows.yml
      - apps/desktop/src-tauri/src/docu.rs
      - scripts/ci/component_registry.json
  pull_request:
    paths:
      - .github/workflows/pr-documentary-windows.yml
      - apps/desktop/src-tauri/src/docu.rs
      - scripts/ci/component_registry.json

permissions:
  contents: read

concurrency:
  group: pr-documentary-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentary-windows:
    name: documentary-windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Record source and toolchain
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read checked-out source SHA' }
          if ($head -ne $env:SOURCE_SHA) { throw "Checked out $head, expected $env:SOURCE_SHA" }
          Write-Host "Source SHA: $head"
          Write-Host "Runner: $env:ImageOS $env:ImageVersion ($([System.Environment]::OSVersion.VersionString))"
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is not available' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo is not available' }

      - name: Run desktop host tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'desktop-host-tests.log'
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop host tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          foreach ($name in @(
            'docu::tests::junction_aliases_into_source_store_are_refused',
            'docu::tests::existing_run_inside_source_store_is_refused_before_any_write',
            'docu::tests::source_store_refuses_new_documentary_output')) {
            if ($text -notmatch "(?m)^test $([regex]::Escape($name)) \.\.\. ok\s*$") {
              throw "$name did not run as ok (missing, ignored or failed)"
            }
            Write-Host "$name: ok"
          }
