name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0-rc1)"
        required: true
        type: string
      channel:
        description: "Release channel; only stable may be published as production"
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - stable
      publish:
        description: "Publish a GitHub Release after the build succeeds"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

# Signing secrets are only reachable from a workflow_dispatch on protected
# refs/heads/main. A dispatch on any other ref starts no job; a v* tag push
# builds an unsigned candidate until the owner confirms v* tag protection.
jobs:
  build:
    name: Build Windows x64 release bundle
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'candidate' }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Fail closed on untrusted release refs
        shell: pwsh
        env:
          TRUSTED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: |
          if ($env:TRUSTED_RELEASE -ne 'true' -and $env:RELEASE_CHANNEL -ne 'candidate') {
            throw 'Only a workflow_dispatch on refs/heads/main may build a signed stable release'
          }

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set deterministic source timestamp
        shell: pwsh
        run: |
          $epoch = [int64](git show -s --format=%ct $env:SOURCE_SHA)
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV

      - name: Install pinned desktop build toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build desktop host
        shell: pwsh
        run: |
          $env:DUBFLOW_RELEASE_VERSION = $env:RELEASE_VERSION
          $env:DUBFLOW_RELEASE_CHANNEL = $env:RELEASE_CHANNEL
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          npm ci --prefix apps/desktop
          npm test --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop queue/voice tests failed' }
          npm run build --prefix apps/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Installed voice catalog tests failed' }
          npm run tauri:build --prefix apps/desktop
          $desktopHost = Join-Path $PWD "apps/desktop/src-tauri/target/release/DubFlow.exe"
          if (-not (Test-Path -LiteralPath $desktopHost -PathType Leaf)) {
            throw "Tauri desktop host was not produced: $desktopHost"
          }

      - name: Build durable Rust supervisor
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo test --manifest-path crates/job-supervisor/app/Cargo.toml --target-dir crates/job-supervisor/app/target --locked
          if ($LASTEXITCODE -ne 0) { throw 'Supervisor start-option tests failed' }
          cargo test --manifest-path crates/job-supervisor/state/Cargo.toml --target-dir crates/job-supervisor/app/target --locked
          if ($LASTEXITCODE -ne 0) { throw 'Durable start binding and migration tests failed' }
          cargo build --manifest-path crates/job-supervisor/app/Cargo.toml --target-dir crates/job-supervisor/app/target --locked --release
          $supervisor = Join-Path $PWD 'crates/job-supervisor/app/target/release/dubflow-supervisor.exe'
          if (-not (Test-Path -LiteralPath $supervisor -PathType Leaf)) {
            throw "Rust supervisor was not produced: $supervisor"
          }

      - name: Install app-owned build runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install pinned production Python dependencies into app runtime
        shell: pwsh
        run: |
          $sitePackages = Join-Path $env:pythonLocation 'Lib/site-packages'
          python -m pip install --disable-pip-version-check --no-cache-dir --upgrade --target $sitePackages -r packaging/runtime/requirements-windows-x64.txt
          # Declared extras of these packages are never imported by DubFlow (#226).
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps --target $sitePackages -r packaging/runtime/requirements-windows-x64-nodeps.txt
          Push-Location $env:RUNNER_TEMP
          try {
            & (Join-Path $env:pythonLocation 'python.exe') -c "import faster_whisper, argostranslate, cryptography; import packaging.version as version; print('production Python adapters imported with packaging', version.__file__)"
            & (Join-Path $env:pythonLocation 'python.exe') -c "from vieneu._v3_turbo_engine.onnx_runtime_lite import OnnxV3LiteEngine; from vieneu_utils.phonemize_text import phonemize_text; from vieneu_utils.core_utils import max_expected_frames; print('VieNeu ONNX preset path imports without its demo extras')"
            if ($LASTEXITCODE -ne 0) { throw 'VieNeu ONNX preset path is incomplete without --no-deps extras' }
            & (Join-Path $env:pythonLocation 'python.exe') -c "import sys; import argostranslate.package, argostranslate.settings, ctranslate2, sentencepiece; assert not {'torch','stanza','spacy'} & set(sys.modules), sorted({'torch','stanza','spacy'} & set(sys.modules)); print('Argos package runtime imports without torch/stanza/spacy')"
            if ($LASTEXITCODE -ne 0) { throw 'Argos package runtime needs dependencies that --no-deps removed' }
          } finally {
            Pop-Location
          }

      - name: Test Windows native source boundaries
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $nativeSourceLog = Join-Path $env:RUNNER_TEMP 'dubflow-native-source-tests.log'
          cargo test --manifest-path crates/job-supervisor/app/Cargo.toml --target-dir crates/job-supervisor/app/target --locked --release source_server::tests:: -- --nocapture --color never 2>&1 | Tee-Object -FilePath $nativeSourceLog
          if ($LASTEXITCODE -ne 0) { throw 'Windows native source boundary tests failed' }
          $nativeSourceEvidence = Get-Content -LiteralPath $nativeSourceLog -Raw
          foreach ($nativeSourceTest in @(
            'native_worker_observes_normal_paths_after_canonical_windows_launch',
            'native_inventory_refuses_identical_directory_junction',
            'native_final_inventory_refuses_post_hash_missing_extra_or_resized_files',
            'native_final_inventory_refuses_post_hash_directory_junction',
            'native_full_nested_inventory_is_verified_without_skipping_files',
            'native_recorded_stdio_commits_pauses_and_restarts_from_page_n',
            'native_recorded_download_commits_verified_owned_media_and_reopens',
            'native_single_video_commits_original_mode_and_download_after_reopen',
            'native_single_video_refuses_mode_rebinding_and_private_reference',
            'native_download_pause_preserves_parts_and_refuses_old_dispatch_on_resume',
            'native_download_failure_and_cancel_leave_siblings_executable',
            'native_interrupted_download_reopens_with_new_epoch_and_original_producer',
            'native_download_refuses_false_hash_and_unsuccessful_worker_exit',
            'native_download_recovers_verified_publication_after_rejected_commit',
            'native_download_refuses_foreign_packet_without_mutating_progress',
            'native_verified_media_refuses_replaced_path_after_hash'
          )) {
            $nativeSourcePattern = '(?m)^test source_server::tests::' + [regex]::Escape($nativeSourceTest) + ' \.\.\. ok\r?$'
            if ($nativeSourceEvidence -notmatch $nativeSourcePattern) { throw "Missing Windows native evidence: $nativeSourceTest" }
          }
          $sourceQueueLog = Join-Path $env:RUNNER_TEMP 'dubflow-source-queue-tests.log'
          cargo test --manifest-path crates/job-supervisor/source_queue/Cargo.toml --target-dir crates/job-supervisor/app/target --locked --release -- --color never 2>&1 | Tee-Object -FilePath $sourceQueueLog
          if ($LASTEXITCODE -ne 0) { throw 'Windows source queue transaction tests failed' }
          $sourceQueueEvidence = Get-Content -LiteralPath $sourceQueueLog -Raw
          foreach ($sourceQueueTest in @(
            'indexed_item_is_scoped_and_returns_the_current_complete_snapshot',
            'bound_items_refuse_unchecked_writes_and_alias',
            'checked_item_commit_is_single_use_and_preserves_completed_enumeration',
            'checked_items_refuse_changed_producer_scope_and_original_item',
            'same_clock_pause_resume_and_competing_item_commit_refuse_late_callbacks',
            'recovered_item_dispatch_requires_a_new_supervisor_snapshot',
            'completed_enumeration_recovery_invalidates_inflight_item_dispatch',
            'exhausted_completed_item_recovery_preserves_other_running_scans',
            'paused_cancelled_progress_and_count_failure_preserve_items_atomically',
            'item_revision_write_failure_and_exhaustion_roll_back_all_mutations'
          )) {
            $sourceQueuePattern = '(?m)^test tests::' + [regex]::Escape($sourceQueueTest) + ' \.\.\. ok\r?$'
            if ($sourceQueueEvidence -notmatch $sourceQueuePattern) { throw "Missing Windows source queue evidence: $sourceQueueTest" }
          }
          $mediaLifetimeLog = Join-Path $env:RUNNER_TEMP 'dubflow-source-media-lifetime-tests.log'
          python -m unittest discover -s tests/source_materializer -p test_stream_materializer.py -v 2>&1 | Tee-Object -FilePath $mediaLifetimeLog
          if ($LASTEXITCODE -ne 0) { throw 'Windows source media lifetime tests failed' }
          $mediaLifetimeEvidence = Get-Content -LiteralPath $mediaLifetimeLog -Raw
          if ($mediaLifetimeEvidence -notmatch '(?m)^test_windows_parent_loss_retires_owned_media_process_tree \(.*\) \.\.\. ok\r?$') {
            throw 'Missing Windows media process-tree parent-loss evidence'
          }

      - name: Download and verify app-owned FFmpeg runtime
        shell: pwsh
        run: |
          # BtbN retains the last build of each month for two years; daily
          # builds expire after fourteen days. Keep an exact monthly pin.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-9.0.zip'
          $expected = '6b264b9e6019103f601d98c292bd332fd87acf1c5e941ddff4fb71760fe63432'
          $archive = Join-Path $env:RUNNER_TEMP 'dubflow-ffmpeg.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive hash mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'dubflow-ffmpeg'
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -LiteralPath $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $extract -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe' }
          $mediaRoot = Join-Path $env:pythonLocation 'media'
          New-Item -ItemType Directory -Force -Path $mediaRoot | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $mediaRoot 'ffmpeg.exe')
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $mediaRoot 'ffprobe.exe')
          & (Join-Path $mediaRoot 'ffmpeg.exe') -version | Select-Object -First 1

      - name: Provision reviewed source SDK into owned runtime
        shell: pwsh
        run: |
          & (Join-Path $env:pythonLocation 'python.exe') -B -m engine.dubflow.download.runtime --runtime-root $env:pythonLocation
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed source SDK provisioning failed' }

      - name: Validate release source and build qualification bundle
        shell: pwsh
        run: |
          python scripts/validate_governance.py
          python -m unittest discover -s tests/release -p 'test_*.py'
          $args = @(
            '-m', 'packaging.release.builder',
            '--source-root', '.',
            '--output-dir', 'dist/qualification',
            '--version', $env:RELEASE_VERSION,
            '--source-sha', $env:SOURCE_SHA,
            '--runtime-root', $env:pythonLocation,
            '--runtime-version', '3.12.10',
            '--package-manifest-version', 'v1',
            # Qualification is an unsigned rehearsal bundle. The final
            # bundle below is the only artifact allowed to claim stable.
            '--release-channel', 'candidate',
            '--desktop-binary', (Join-Path $PWD 'apps/desktop/src-tauri/target/release/DubFlow.exe'),
            '--require-desktop-host',
            '--supervisor-binary', (Join-Path $PWD 'crates/job-supervisor/app/target/release/dubflow-supervisor.exe'),
            '--require-supervisor',
            '--source-date-epoch', $env:SOURCE_DATE_EPOCH
          )
          python @args

      - name: Verify staged source SDK with owned Python
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist/qualification/DubFlow-$env:RELEASE_VERSION-windows-x64-staging"
          & (Join-Path $stage 'runtime/python.exe') -I -S -B scripts/release/source_runtime_smoke.py `
            --root $stage --expected-source-sha $env:SOURCE_SHA --report dist/qualification/source-sdk-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Staged source SDK/runtime qualification failed' }

      - name: Run real CPU pipeline qualification smoke
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist/qualification/DubFlow-$env:RELEASE_VERSION-windows-x64-staging"
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'DubFlow smoke host'
          $dataRoot = Join-Path $smokeRoot 'LocalAppData/DubFlow'
          $workRoot = Join-Path $env:RUNNER_TEMP 'DubFlow qualification work'
          $supervisor = Join-Path $stage 'app/bin/dubflow-supervisor.exe'
          $ffmpeg = Join-Path $stage 'runtime/media/ffmpeg.exe'
          $ffprobe = Join-Path $stage 'runtime/media/ffprobe.exe'
          New-Item -ItemType Directory -Force -Path $dataRoot, $workRoot | Out-Null
          & (Join-Path $env:pythonLocation 'python.exe') scripts/release/production_smoke.py `
            --supervisor $supervisor --root $stage --data-root $dataRoot --work-root $workRoot `
            --ffmpeg $ffmpeg --ffprobe $ffprobe --exercise-hard-kill --long-seconds 60 `
            --enable-dubbing `
            --report (Join-Path $PWD 'dist/qualification/pipeline-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Real CPU pipeline qualification smoke failed' }

      - name: Qualify streaming PCM in verified staged owned runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist/qualification/DubFlow-$env:RELEASE_VERSION-windows-x64-staging"
          python tests/audio_mix/qualify_streaming.py --root $stage --expected-source-sha $env:SOURCE_SHA `
            --work (Join-Path $env:RUNNER_TEMP 'DubFlow staged streaming PCM') `
            --report (Join-Path $PWD 'dist/qualification/streaming-pcm.json')
          if ($LASTEXITCODE -ne 0) { throw 'Staged owned streaming PCM qualification failed' }

      - name: Build final release bundle after qualification
        shell: pwsh
        env:
          DUBFLOW_RELEASE_PRIVATE_KEY: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.channel == 'stable') && secrets.DUBFLOW_RELEASE_PRIVATE_KEY || '' }}
        run: |
          $final = Join-Path $PWD 'dist/final'
          $args = @(
            '-m', 'packaging.release.builder',
            '--source-root', '.',
            '--output-dir', $final,
            '--version', $env:RELEASE_VERSION,
            '--source-sha', $env:SOURCE_SHA,
            '--runtime-root', $env:pythonLocation,
            '--runtime-version', '3.12.10',
            '--package-manifest-version', 'v1',
            '--release-channel', $env:RELEASE_CHANNEL,
            '--desktop-binary', (Join-Path $PWD 'apps/desktop/src-tauri/target/release/DubFlow.exe'),
            '--require-desktop-host',
            '--supervisor-binary', (Join-Path $PWD 'crates/job-supervisor/app/target/release/dubflow-supervisor.exe'),
            '--require-supervisor',
            '--source-date-epoch', $env:SOURCE_DATE_EPOCH
          )
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            if ([string]::IsNullOrWhiteSpace($env:DUBFLOW_RELEASE_PRIVATE_KEY)) { throw 'DUBFLOW_RELEASE_PRIVATE_KEY is required for a stable production build' }
            $keyPath = Join-Path $env:RUNNER_TEMP 'dubflow-release-ed25519.key'
            [IO.File]::WriteAllText($keyPath, $env:DUBFLOW_RELEASE_PRIVATE_KEY.Trim() + "`n", [Text.Encoding]::ASCII)
            $args += @('--signature-required', '--signature-private-key-file', $keyPath, '--production-qualified')
          }
          python @args

      - name: Build one-click user-owned setup executable
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "dist/DubFlow-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $payload = (Resolve-Path (Join-Path $PWD "dist/final/DubFlow-$env:RELEASE_VERSION-windows-x64.zip")).Path
          $rustc = Get-Command rustc.exe -ErrorAction SilentlyContinue
          if ($null -eq $rustc) { throw 'rustc.exe is required to build the non-elevated Windows setup executable' }
          & $rustc.Source --version | Out-Host
          # The stable root DubFlow.exe that shortcuts open; setup embeds it.
          $launcherTests = Join-Path $env:RUNNER_TEMP 'windows-launcher-tests.exe'
          & $rustc.Source --edition=2021 --test packaging/release/windows_launcher.rs -o $launcherTests
          if ($LASTEXITCODE -ne 0) { throw 'Root launcher test build failed' }
          & $launcherTests
          if ($LASTEXITCODE -ne 0) { throw 'Root launcher tests failed' }
          $launcher = Join-Path $env:RUNNER_TEMP 'DubFlow-root-launcher.exe'
          & $rustc.Source --edition=2021 -O -C target-feature=+crt-static packaging/release/windows_launcher.rs -o $launcher
          if ($LASTEXITCODE -ne 0) { throw 'Root launcher build failed' }
          $env:DUBFLOW_PAYLOAD = $payload
          $env:DUBFLOW_LAUNCHER = $launcher
          $env:DUBFLOW_VERSION = $env:RELEASE_VERSION
          & $rustc.Source --edition=2021 -O -C target-feature=+crt-static packaging/release/windows_setup.rs -o $setup
          if ($LASTEXITCODE -ne 0) { throw 'Rust user-owned setup bootstrapper build failed' }

      - name: Sign the in-app update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          DUBFLOW_UPDATE_SIGNING_KEY: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.DUBFLOW_UPDATE_SIGNING_KEY || '' }}
        run: |
          if (-not $env:DUBFLOW_UPDATE_SIGNING_KEY) { throw 'DUBFLOW_UPDATE_SIGNING_KEY secret is required to sign the update manifest' }
          $notes = Join-Path $env:RUNNER_TEMP 'update-notes.txt'
          Set-Content -LiteralPath $notes -Value "DubFlow $env:RELEASE_VERSION" -Encoding utf8NoBOM
          python -m engine.dubflow.update.sign --key-env DUBFLOW_UPDATE_SIGNING_KEY --version $env:RELEASE_VERSION --channel $env:RELEASE_CHANNEL --setup "dist/DubFlow-$env:RELEASE_VERSION-windows-x64-setup.exe" --notes-file $notes --out dist/update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'update manifest signing failed' }

      - name: Produce checksums and evidence
        shell: pwsh
        run: |
          $finalDir = Join-Path $PWD 'dist/final'
          $finalZip = Join-Path $finalDir "DubFlow-$env:RELEASE_VERSION-windows-x64.zip"
          $finalZipSha = Join-Path $finalDir "DubFlow-$env:RELEASE_VERSION-windows-x64.zip.sha256"
          Copy-Item -LiteralPath $finalZip -Destination (Join-Path $PWD 'dist') -Force
          Copy-Item -LiteralPath $finalZipSha -Destination (Join-Path $PWD 'dist') -Force
          $files = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.sha256' }
          $lines = foreach ($file in $files | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath "dist/DubFlow-$env:RELEASE_VERSION-windows-x64-release.sha256" -Encoding utf8NoBOM
          $evidence = [ordered]@{
            schema_version = 1
            source_sha = $env:SOURCE_SHA
            version = $env:RELEASE_VERSION
            channel = $env:RELEASE_CHANNEL
            production_qualified = ($env:RELEASE_CHANNEL -eq 'stable')
            signature = if ($env:RELEASE_CHANNEL -eq 'stable') { 'ed25519:dubflow-release-v1' } else { 'unsigned-candidate' }
            clean_machine = if ($env:RELEASE_CHANNEL -eq 'stable') { 'passed' } else { 'qualification-only' }
            cpu_local_file = if ($env:RELEASE_CHANNEL -eq 'stable') { 'passed' } else { 'qualification-only' }
            synthetic_long_form = if ($env:RELEASE_CHANNEL -eq 'stable') { 'passed' } else { 'qualification-only' }
            gpu_hardware = 'not_applicable_cpu_profile'
            qualification_scope = 'cpu-local-file-b2'
            qualification_report = 'dist/qualification/pipeline-smoke.json'
            artifacts = @($files | Sort-Object Name | ForEach-Object {
              [ordered]@{ name = $_.Name; size_bytes = $_.Length.ToString([Globalization.CultureInfo]::InvariantCulture); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "dist/DubFlow-$env:RELEASE_VERSION-release-evidence.json" -Encoding utf8NoBOM

      - name: Smoke install and launch desktop host
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'DubFlow smoke host'
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'LocalAppData'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $setup = Join-Path $PWD "dist/DubFlow-$env:RELEASE_VERSION-windows-x64-setup.exe"
          # The setup is a windowed program; --silent installs without its window.
          # Wait for the setup process only: pwsh's Start-Process -Wait also
          # waits for the DubFlow window the setup opens, which never exits here.
          $setupProcess = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru
          if (-not $setupProcess.WaitForExit(1800000)) { throw 'Windows setup did not finish within 30 minutes' }
          if ($setupProcess.ExitCode -ne 0) {
            Get-Content -LiteralPath (Join-Path $env:TEMP 'DubFlow-setup.log') -ErrorAction SilentlyContinue | Out-Host
            throw "Windows setup failed with exit code $($setupProcess.ExitCode)"
          }
          $installRoot = Join-Path $env:LOCALAPPDATA 'DubFlow'
          foreach ($file in @('DubFlow.exe', 'DubFlow.ico', 'uninstall.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot $file) -PathType Leaf)) { throw "Setup did not create $file" }
          }
          $registered = Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DubFlow'
          if ($registered.InstallLocation -ne $installRoot -or $registered.DisplayVersion -ne $env:RELEASE_VERSION) { throw 'Setup did not register DubFlow under Installed apps' }
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'DubFlow.lnk'
          if ((New-Object -ComObject WScript.Shell).CreateShortcut($startMenu).TargetPath -ne (Join-Path $installRoot 'DubFlow.exe')) { throw 'Setup did not create the Start menu shortcut' }
          $launcher = Join-Path $env:LOCALAPPDATA 'DubFlow/DubFlow.cmd'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw "Installed launcher is missing: $launcher" }
          $check = & $launcher --self-check | ConvertFrom-Json
          if (-not $check.ready) { throw "Installed self-check failed: $($check | ConvertTo-Json -Compress)" }
          $installedRoot = Join-Path $env:LOCALAPPDATA "DubFlow/versions/$env:RELEASE_VERSION"
          $installedHost = Join-Path $installedRoot 'app/bin/DubFlow.exe'
          for ($wait = 0; $wait -lt 30; $wait++) {
            $hosts = @(Get-Process -Name 'DubFlow' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installedHost })
            if ($hosts.Count -ge 1) { break }
            Start-Sleep -Seconds 1
          }
          if ($hosts.Count -ne 1) { throw 'Setup did not auto-launch exactly one host from the installed runtime' }
          $installedHostPid = $hosts[0].Id
          & (Join-Path $installedRoot 'runtime/python.exe') -I -S -B scripts/release/desktop_runtime_smoke.py `
            --root $installedRoot --data-root (Join-Path $env:LOCALAPPDATA 'DubFlow') `
            --expected-source-sha $env:SOURCE_SHA --report (Join-Path $PWD 'dist/installed-desktop-runtime-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Normal desktop launch invalidated the installed runtime or failed WebView2 initialization' }
          & (Join-Path $installedRoot 'runtime/python.exe') -I -S -B scripts/release/source_runtime_smoke.py `
            --root $installedRoot --expected-source-sha $env:SOURCE_SHA --report dist/installed-source-sdk-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed source SDK/runtime qualification failed' }
          # Keep the installed qualification independent from the staging
          # smoke above.  Reusing its durable job store with the same smoke
          # IDs would correctly return COMPLETED without recreating artifacts
          # in this step's new work directory.
          $installedDataRoot = Join-Path $env:RUNNER_TEMP 'DubFlow installed data'
          New-Item -ItemType Directory -Force -Path $installedDataRoot | Out-Null
          $pipelineReport = Join-Path $PWD 'dist/installed-pipeline-smoke.json'
          & (Join-Path $env:pythonLocation 'python.exe') scripts/release/production_smoke.py `
            --supervisor (Join-Path $installedRoot 'app/bin/dubflow-supervisor.exe') `
            --root $installedRoot --data-root $installedDataRoot `
            --work-root (Join-Path $env:RUNNER_TEMP 'DubFlow installed work') `
            --ffmpeg (Join-Path $installedRoot 'runtime/media/ffmpeg.exe') `
            --ffprobe (Join-Path $installedRoot 'runtime/media/ffprobe.exe') `
            --long-seconds 60 --enable-dubbing --report $pipelineReport
          if ($LASTEXITCODE -ne 0) { throw 'Installed production pipeline smoke failed' }
          python tests/audio_mix/qualify_streaming.py --root $installedRoot --expected-source-sha $env:SOURCE_SHA `
            --work (Join-Path $env:RUNNER_TEMP 'DubFlow installed streaming PCM') `
            --report (Join-Path $PWD 'dist/installed-streaming-pcm.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed owned streaming PCM qualification failed' }
          Start-Sleep -Seconds 8
          $hostProcess = Get-Process -Id $installedHostPid -ErrorAction SilentlyContinue
          if ($null -eq $hostProcess -or $hostProcess.Path -ne $installedHost) { throw 'Installed desktop host stopped during qualification' }
          Stop-Process -Id $installedHostPid -Force
          $evidencePath = "dist/DubFlow-$env:RELEASE_VERSION-release-evidence.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName desktop_host -NotePropertyValue ([ordered]@{
            packaged_path = 'app/bin/DubFlow.exe'
            launch_smoke = 'passed'
            post_launch_inventory = 'passed'
            runtime_report = 'dist/installed-desktop-runtime-smoke.json'
          }) -Force
          $evidence | Add-Member -NotePropertyName installed_pipeline_smoke -NotePropertyValue 'passed' -Force
          $evidence | Add-Member -NotePropertyName source_sdk_runtime -NotePropertyValue ([ordered]@{
            scope = 'source-sdk-runtime-health'
            staged_report = 'dist/qualification/source-sdk-smoke.json'
            installed_report = 'dist/installed-source-sdk-smoke.json'
            staged = 'passed'
            installed = 'passed'
            live_source_acquisition = 'not_run'
            browser_session = 'not_run'
            durable_intake_enumeration = 'not_run'
          }) -Force
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding utf8NoBOM

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: DubFlow-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            dist/DubFlow-${{ env.RELEASE_VERSION }}-windows-x64.zip
            dist/DubFlow-${{ env.RELEASE_VERSION }}-windows-x64.zip.sha256
            dist/DubFlow-${{ env.RELEASE_VERSION }}-windows-x64-setup.exe
            dist/DubFlow-${{ env.RELEASE_VERSION }}-windows-x64-release.sha256
            dist/DubFlow-${{ env.RELEASE_VERSION }}-release-evidence.json
            dist/update-manifest.json
            dist/qualification/pipeline-smoke.json
            dist/qualification/source-sdk-smoke.json
            dist/installed-pipeline-smoke.json
            dist/installed-source-sdk-smoke.json
            dist/qualification/streaming-pcm.json
            dist/installed-streaming-pcm.json
            dist/installed-desktop-runtime-smoke.json
          if-no-files-found: error

  publish:
    name: Publish stable production GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true && inputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: DubFlow-${{ inputs.version }}-windows-x64
          path: dist

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            echo "Only a signed stable production build may be published; candidate artifacts remain qualification-only." >&2
            exit 1
          fi
          evidence="dist/DubFlow-${RELEASE_VERSION}-release-evidence.json"
          if [[ ! -f "$evidence" ]]; then
            echo "Production evidence is missing: $evidence" >&2
            exit 1
          fi
          if [[ "$(jq -r '.production_qualified' "$evidence")" != "true" || "$(jq -r '.signature' "$evidence")" != "ed25519:dubflow-release-v1" ]]; then
            echo "Production evidence is not signed and qualified" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]; then
            echo "Release version has an unsafe format: $RELEASE_VERSION" >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION#v}"
          release_json=""
          if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>/dev/null); then
            echo "Refusing to overwrite an existing release tag: $tag" >&2
            exit 1
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "DubFlow ${RELEASE_VERSION} (Windows production)" \
              --notes "Signed Windows production release for the CPU local-file profile. The attached evidence records setup, supervisor, model bootstrap, subtitle translation, H.264/AAC render, QC, editable artifacts, batch isolation and recovery smoke on an isolated runner."
          fi
          resolved_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq '.sha')
          if [[ "$resolved_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag $tag resolves to $resolved_sha, expected build SHA $SOURCE_SHA" >&2
            exit 1
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "dist/DubFlow-${RELEASE_VERSION}-windows-x64.zip" \
            "dist/DubFlow-${RELEASE_VERSION}-windows-x64.zip.sha256" \
            "dist/DubFlow-${RELEASE_VERSION}-windows-x64-setup.exe" \
            "dist/DubFlow-${RELEASE_VERSION}-windows-x64-release.sha256" \
            "dist/DubFlow-${RELEASE_VERSION}-release-evidence.json" \
            "dist/update-manifest.json" \
            "dist/qualification/pipeline-smoke.json" \
            "dist/installed-pipeline-smoke.json" \
            --clobber
