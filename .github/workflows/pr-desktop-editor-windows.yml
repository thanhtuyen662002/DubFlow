name: PR Desktop Editor Windows

# The desktop host is a Windows product: its Rust tests use Windows paths,
# LOCALAPPDATA/USERPROFILE and drive APIs, so they run here rather than in
# the Linux PR Integration job (#417). Read-only: no secrets, signing,
# release, upload or publish step. The push trigger only bootstraps the lane
# on its own task branch before the file exists on Main.
on:
  push:
    branches: [agent/issue-417-desktop-editor-subtitles-ci]
    paths:
      - .github/workflows/pr-desktop-editor-windows.yml
      - apps/desktop/index.html
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - apps/desktop/src/**
      - apps/desktop/test/**
      - apps/desktop/src-tauri/**
      - engine/dubflow/media/adapter.py
      - tests/production/media/**
      - engine/dubflow/worker/beep_sounds.py
      - tests/production/worker/test_beep.py
      - engine/dubflow/worker/production_job.py
      - tests/production/worker/test_dubbing_mastering.py
      - engine/dubflow/separation/split.py
      - tests/separation/test_music_split.py
      - engine/dubflow/separation/__main__.py
      - engine/dubflow/separation/outdir.py
      - tests/separation/test_editor_cli.py
      - engine/dubflow/product/job.py
      - engine/dubflow/product/__main__.py
      - tests/product/test_status_write.py
      - engine/dubflow/compilation/job.py
      - engine/dubflow/compilation/program.py
      - engine/dubflow/package/job.py
      - tests/product/test_source_rule.py
  pull_request:
    paths:
      - .github/workflows/pr-desktop-editor-windows.yml
      - apps/desktop/index.html
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - apps/desktop/src/**
      - apps/desktop/test/**
      - apps/desktop/src-tauri/**
      - engine/dubflow/media/adapter.py
      - tests/production/media/**
      - engine/dubflow/worker/beep_sounds.py
      - tests/production/worker/test_beep.py
      - engine/dubflow/worker/production_job.py
      - tests/production/worker/test_dubbing_mastering.py
      - engine/dubflow/separation/split.py
      - tests/separation/test_music_split.py
      - engine/dubflow/separation/__main__.py
      - engine/dubflow/separation/outdir.py
      - tests/separation/test_editor_cli.py
      - engine/dubflow/product/job.py
      - engine/dubflow/product/__main__.py
      - tests/product/test_status_write.py
      - engine/dubflow/compilation/job.py
      - engine/dubflow/compilation/program.py
      - engine/dubflow/package/job.py
      - tests/product/test_source_rule.py

permissions:
  contents: read

concurrency:
  group: pr-desktop-editor-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-editor-windows:
    name: desktop-editor-windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Record source and toolchain
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read checked-out source SHA' }
          if ($head -ne $env:SOURCE_SHA) { throw "Checked out $head, expected $env:SOURCE_SHA" }
          Write-Host "Source SHA: $head"
          Write-Host "Runner: $env:ImageOS $env:ImageVersion ($([System.Environment]::OSVersion.VersionString))"
          node --version
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is not available' }

      - name: Build the editor and run the desktop host tests
        shell: pwsh
        run: |
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop editor tests failed' }
          npm run build --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop editor build failed' }
          $log = Join-Path $env:RUNNER_TEMP 'desktop-host-tests.log'
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop host tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -notmatch '(?m)^test result: ok\. (\d+) passed; 0 failed;') { throw 'Desktop host test summary missing' }
          Write-Host "Desktop host tests passed: $($Matches[1])"

      - name: Download the app's pinned FFmpeg build
        shell: pwsh
        env:
          FFMPEG_GH_TOKEN: ${{ github.token }}
        run: |
          # Same exact build and SHA-256 as release.yml's app-owned runtime.
          $url = 'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-9.0.zip'
          $expected = '6b264b9e6019103f601d98c292bd332fd87acf1c5e941ddff4fb71760fe63432'
          $archive = Join-Path $env:RUNNER_TEMP 'dubflow-ffmpeg.zip'
          # github.com's release-download route times out (504) for this asset since
          # 2026-11-08; retry it, then fetch the same asset through the releases API.
          $downloaded = $false
          foreach ($attempt in 1..3) {
            try { Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing; $downloaded = $true; break }
            catch { Write-Warning "FFmpeg download attempt $attempt failed: $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $downloaded) {
            $parts = $url -split '/'
            $env:GH_TOKEN = $env:FFMPEG_GH_TOKEN
            gh release download $parts[7] --repo "$($parts[3])/$($parts[4])" --pattern $parts[8] --output $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg archive download failed' }
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive hash mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'dubflow-ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -LiteralPath $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'FFmpeg archive did not contain ffmpeg.exe' }
          "DUBFLOW_TEST_FFMPEG=$($ffmpeg.FullName)" >> $env:GITHUB_ENV

      - name: Run the media adapter tests against real FFmpeg
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'media-tests.log'
          python -B -m unittest discover -s tests/production/media -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Media adapter tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Media adapter tests skipped some cases' }
          if ($text -notmatch '(?m)^Ran (\d+) tests? in ') { throw 'Media test count missing' }
          Write-Host "Media adapter tests passed: $($Matches[1]), none skipped"

      - name: Run the status-file write tests with a real reader holding the file (#766)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'status-write-tests.log'
          python -B -m unittest tests.product.test_status_write -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Status write tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Status write tests skipped some cases' }
          if ($text -notmatch '(?m)^Ran (\d+) tests? in ') { throw 'Status write test count missing' }
          Write-Host "Status write tests passed: $($Matches[1]), none skipped"

      - name: Run the worker's source-rule tests with real junctions and symlinks (#816)
        shell: pwsh
        run: |
          # The rule's own cases (standard library only). The whole Bán hàng render in the same file
          # (ReadOnlyRenderTests) stays in the Linux lanes.
          $log = Join-Path $env:RUNNER_TEMP 'source-rule-tests.log'
          python -B -m unittest `
            tests.product.test_source_rule.PlainFileTests `
            tests.product.test_source_rule.SpecTests `
            tests.product.test_source_rule.CompilationSourceTests `
            tests.product.test_source_rule.LegacyMusicTests `
            tests.product.test_source_rule.JunctionTests `
            -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Source-rule tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Source-rule tests skipped some cases (a junction or a symlink could not be made)' }
          $junctions = [regex]::Matches($text, '(?m)^test_\S+ \(tests\.product\.test_source_rule\.JunctionTests\.\S+\) \.\.\. ok').Count
          if ($junctions -ne 6) { throw "Expected 6 junction tests to pass against a real junction, saw $junctions" }
          if ($text -notmatch '(?m)^Ran (\d+) tests? in ') { throw 'Source-rule test count missing' }
          Write-Host "Source-rule tests passed on Windows: $($Matches[1]) (6 against a real junction), none skipped"

      - name: Run the custom beep-sound decode test against real FFmpeg
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'beep-sound-tests.log'
          python -B -m unittest tests.production.worker.test_beep.BeepTests.test_custom_sound_through_the_real_ffmpeg -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Custom beep-sound test failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Custom beep-sound test was skipped' }
          if ($text -notmatch '(?m)^Ran 1 test in ') { throw 'Custom beep-sound test did not run' }
          Write-Host 'Custom beep-sound decode test passed through the pinned FFmpeg, not skipped'

      - name: Run the music/SFX split tests on Windows
        shell: pwsh
        run: |
          # The runtime's own numpy pin (packaging/runtime/requirements-windows-x64.txt); no new dependency.
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { throw 'numpy install failed' }
          $log = Join-Path $env:RUNNER_TEMP 'music-split-tests.log'
          python -B -m unittest tests.separation.test_music_split tests.separation.test_editor_cli -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Music/SFX split tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Music/SFX split tests skipped some cases' }
          if ($text -notmatch '(?m)^Ran 16 tests in ') { throw 'Expected 16 music/SFX split and separation CLI tests (junctions included)' }
          Write-Host 'Music/SFX split + separation CLI tests passed on Windows: 16, none skipped'

      - name: Run the mastering planted-link tests with real FFmpeg, real junctions and symlinks (#821)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'mastering-link-tests.log'
          python -B -m unittest `
            tests.production.worker.test_dubbing_mastering.PlantedLinkTests.test_windows_links_at_the_old_names_are_never_written_through `
            tests.production.worker.test_dubbing_mastering.PlantedLinkTests.test_windows_junctions_at_the_old_names_are_never_written_through `
            tests.production.worker.test_dubbing_mastering.AacTrueCeilingTests.test_a_link_at_the_mastered_mix_is_replaced_and_a_linked_folder_refused `
            tests.production.worker.test_dubbing_mastering.AacTrueCeilingTests.test_a_linked_mastering_folder_renders_as_off_before_anything_is_written `
            -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Mastering planted-link tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match '\.\.\. skipped') { throw 'Mastering planted-link tests skipped some cases' }
          if ($text -notmatch '(?m)^Ran 4 tests in ') { throw 'Expected 4 mastering planted-link tests (symlinks and junctions, the whole worker with a linked mastering folder included)' }
          Write-Host 'Mastering planted-link tests passed on Windows through the pinned FFmpeg: 4 (3 helper tests and 1 whole-worker run with a junction at the mastering folder), none skipped'
