name: Release / Soak

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run bounded release rehearsal
        run: python tests/soak/runner.py --release-evidence --output tests/soak/release-evidence.json
      - name: Run chaos assertions
        run: python -m unittest discover -s tests/chaos -p 'test_*.py'
