name: PR Fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate repository control plane
        run: python scripts/validate_governance.py
      - name: Install pinned numerical dependency for PCM checks
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r tests/audio_mix/requirements-ci.txt
      - name: Check actual streaming PCM compatibility and restart
        run: python -m unittest discover -s tests/audio_mix -p 'test_streaming.py'
