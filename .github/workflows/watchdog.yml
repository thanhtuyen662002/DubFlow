name: Governance Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  watchdog:
    name: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Classify leases, CI and main integrity
        env:
          GH_TOKEN: \${{ github.token }}
        run: python scripts/watchdog/check.py --repo "$GITHUB_REPOSITORY" --write-issue
