name: Leaf engineering task
description: Executable task that an agent may claim
title: "[TASK] "
body:
  - type: textarea
    id: machine_metadata
    attributes:
      label: Machine-readable task metadata
      description: Keep the schema marker and fill every field. Use issue numbers such as #3,#4 or "none".
      value: |
        DUBFLOW_TASK_V1
        Hard-Dependencies: none
        Soft-Dependencies: none
        Conflict-Domains: none
        Expected-Paths: none
        Required-CI: PR Fast
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Observable result, not implementation activity.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
    validations:
      required: true
  - type: textarea
    id: dependency_rationale
    attributes:
      label: Dependency rationale
      description: Explain why hard dependencies truly block execution and how soft dependencies are mocked or reconciled later.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery/decomposition note
      description: How another agent can resume or how downstream work proceeds if this task stalls.
    validations:
      required: true
